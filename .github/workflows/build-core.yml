name: Build Verification and Core Sync

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: '执行生命周期（小时）'
        required: true
        default: '6'

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v7

      - name: Initialize runtime environments
        env:
          UUID: ${{ secrets.UUID }}
          DURL: ${{ secrets.DURL }}
        run: |
          if [ -z "$UUID" ]; then
            echo "::error::系统配置初始化失败: 核心运行令牌缺失"
            exit 1
          fi

          if [ -z "$DURL" ]; then
            echo "::error::系统配置初始化失败: 远程端点同步器缺失"
            exit 1
          fi

          echo "CORE_ID=$UUID" >> $GITHUB_ENV
          echo "DEST_URL=$DURL" >> $GITHUB_ENV

          RUNTIME_HOURS="${{ github.event.inputs.runtime || '6' }}"
          echo "RUNTIME_HOURS=$RUNTIME_HOURS" >> $GITHUB_ENV

          echo "::add-mask::$UUID"
          echo "::add-mask::$DURL"

      - name: Prepare environment dependencies
        run: |
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -y curl > /dev/null 2>&1

          SRC_BIN=$(echo "aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3lvbmdnZWtray9hcmdvc2J4L21haW4vYXJnb3NieC5zaA==" | base64 -d)

          curl -Ls "$SRC_BIN" -o core_service.sh
          chmod +x core_service.sh

      - name: Validate source jhsub.txt (second line readability)
        id: validate-source
        run: |
          PROTO_PREFIX=$(echo "dmxlc3M6Ly8=" | base64 -d)
          CHK_FLOW=$(echo "Zmxvdz14dGxzLXJwcngtdmlzaW9u" | base64 -d)
          CHK_TYPE=$(echo "dHlwZT13cw==" | base64 -d)
          CHK_HOST=$(echo "aG9zdD0=" | base64 -d)
          CHK_PATH=$(echo "cGF0aD0=" | base64 -d)

          echo "::group::源文件读取与第二行校验"

          SOURCE_FILE=""
          for p in "./agsbx/jhsub.txt" "$HOME/agsbx/jhsub.txt" "/root/agsbx/jhsub.txt" "/home/runner/agsbx/jhsub.txt"; do
            if [ -f "$p" ]; then
              SOURCE_FILE="$p"
              break
            fi
          done

          if [ -z "$SOURCE_FILE" ]; then
            echo "→ 源 jhsub.txt 不存在,跳过本步(后续步骤会重新生成)"
            echo "::endgroup::"
            exit 0
          fi

          echo "→ 找到源文件: $SOURCE_FILE"
          echo "→ 各行长度:"
          awk '{ printf "   第%d行: %d 字节\n", NR, length($0) }' "$SOURCE_FILE"

          SECOND_LINE=$(awk 'NR==2' "$SOURCE_FILE")
          SECOND_LEN=$(echo -n "$SECOND_LINE" | wc -c)
          echo "→ 第二行长度: $SECOND_LEN 字节"
          echo "→ 第二行头部: ${SECOND_LINE:0:80}"
          echo "→ 第二行尾部: ...${SECOND_LINE: -50}"

          if [ -z "$SECOND_LINE" ]; then
            echo "::error::源文件第二行为空"
            echo "::endgroup::"
            exit 1
          fi

          if [ "$SECOND_LEN" -lt 1500 ]; then
            echo "::warning::源文件第二行长度不足 1500,跳过本步(由后续步骤重新生成)"
            echo "::endgroup::"
            exit 0
          fi

          CHECK_OK=1
          CHECK_REASON=""
          [[ "$SECOND_LINE" == "$PROTO_PREFIX"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [协议前缀]"; }
          [[ "$SECOND_LINE" == *"$CHK_FLOW"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [flow]"; }
          [[ "$SECOND_LINE" == *"$CHK_TYPE"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [type]"; }
          [[ "$SECOND_LINE" == *"$CHK_HOST"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [host]"; }
          [[ "$SECOND_LINE" == *"$CHK_PATH"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [path]"; }

          if [ "$CHECK_OK" -ne 1 ]; then
            echo "::error::源文件第二行参数不完整:$CHECK_REASON"
            echo "::endgroup::"
            exit 1
          fi

          echo "✅ 源文件第二行校验通过,后续步骤可直接读取处理"
          echo "::endgroup::"

      - name: Execute core service and parse token
        id: parse-token
        run: |
          PROTO_PREFIX=$(echo "dmxlc3M6Ly8=" | base64 -d)
          ORIGIN_TARGET=$(echo "eWcxLnlna2trLmRwZG5zLm9yZw==" | base64 -d)
          ROUTING_ADD=$(echo "Y2YuODc3Nzc0Lnh5eg==" | base64 -d)
          CHK_FLOW=$(echo "Zmxvdz14dGxzLXJwcngtdmlzaW9u" | base64 -d)
          CHK_TYPE=$(echo "dHlwZT13cw==" | base64 -d)
          CHK_HOST=$(echo "aG9zdD0=" | base64 -d)
          CHK_PATH=$(echo "cGF0aD0=" | base64 -d)

          echo "::group::调试信息:校验参数预览"
          echo "PROTO_PREFIX  = $PROTO_PREFIX"
          echo "ORIGIN_TARGET = $ORIGIN_TARGET"
          echo "ROUTING_ADD   = $ROUTING_ADD"
          echo "CHK_FLOW      = $CHK_FLOW"
          echo "CHK_TYPE      = $CHK_TYPE"
          echo "CHK_HOST      = $CHK_HOST"
          echo "CHK_PATH      = $CHK_PATH"
          echo "::endgroup::"

          RAW_LINE=""
          TARGET_FILE=""

          echo "::group::尝试读取已存在的 jhsub.txt"
          for p in "./agsbx/jhsub.txt" "$HOME/agsbx/jhsub.txt" "/root/agsbx/jhsub.txt" "/home/runner/agsbx/jhsub.txt"; do
            if [ -f "$p" ]; then
              TARGET_FILE="$p"
              break
            fi
          done

          if [ -n "$TARGET_FILE" ]; then
            echo "→ 找到现有文件: $TARGET_FILE"
            echo "→ 各行长度:"
            awk '{ printf "   第%d行: %d 字节\n", NR, length($0) }' "$TARGET_FILE"

            SECOND_LINE=$(awk 'NR==2' "$TARGET_FILE")
            SECOND_LEN=$(echo -n "$SECOND_LINE" | wc -c)
            echo "→ 第二行长度: $SECOND_LEN 字节"

            if [ "$SECOND_LEN" -ge 1500 ]; then
              RAW_LINE="$SECOND_LINE"
              echo "✅ 使用现有文件第二行"
              echo "  头部: ${RAW_LINE:0:100}"
              echo "  尾部: ...${RAW_LINE: -50}"
              echo "::endgroup::"
            else
              echo "⚠️ 现有文件第二行长度不足,需要重新生成"
              TARGET_FILE=""
              echo "::endgroup::"
            fi
          else
            echo "→ 未找到 jhsub.txt,将通过 core_service.sh 生成"
            echo "::endgroup::"
          fi

          if [ -z "$RAW_LINE" ]; then
            MAX_RETRY=5
            SUCCESS=0

            for i in $(seq 1 $MAX_RETRY); do
              echo "::group::第 $i/$MAX_RETRY 次执行核心服务"

              rm -f ./agsbx/jhsub.txt $HOME/agsbx/jhsub.txt /root/agsbx/jhsub.txt /home/runner/agsbx/jhsub.txt 2>/dev/null

              echo "→ 执行 core_service.sh ..."
              vwpt="8080" uuid="${{ env.CORE_ID }}" argo="vwpt" ./core_service.sh > /dev/null 2>&1
              RC=$?
              echo "→ 退出码: $RC"

              sleep 3

              TARGET_FILE=""
              for p in "./agsbx/jhsub.txt" "$HOME/agsbx/jhsub.txt" "/root/agsbx/jhsub.txt" "/home/runner/agsbx/jhsub.txt"; do
                if [ -f "$p" ]; then
                  TARGET_FILE="$p"
                  break
                fi
              done

              if [ -z "$TARGET_FILE" ]; then
                echo "::warning::本轮未生成配置文件"
                echo "::endgroup::"
                sleep 2
                continue
              fi

              echo "→ 本轮输出: $TARGET_FILE"
              echo "→ 各行长度:"
              awk '{ printf "   第%d行: %d 字节\n", NR, length($0) }' "$TARGET_FILE"

              SECOND_LINE=$(awk 'NR==2' "$TARGET_FILE")
              SECOND_LEN=$(echo -n "$SECOND_LINE" | wc -c)
              echo "→ 第二行长度: $SECOND_LEN 字节"

              if [ -z "$SECOND_LINE" ]; then
                echo "::warning::本轮第二行为空"
                echo "::endgroup::"
                sleep 2
                continue
              fi

              if [ "$SECOND_LEN" -lt 1500 ]; then
                echo "::warning::本轮第二行长度不足 1500,疑似被截断"
                echo "  前 100: ${SECOND_LINE:0:100}"
                echo "  后 50:  ...${SECOND_LINE: -50}"
                echo "::endgroup::"
                sleep 2
                continue
              fi

              RAW_LINE="$SECOND_LINE"
              echo "→ 本轮长度合格,采用此版本"
              echo "  头部: ${RAW_LINE:0:100}"
              echo "  尾部: ...${RAW_LINE: -50}"
              echo "::endgroup::"
              SUCCESS=1
              break
            done

            if [ "$SUCCESS" -ne 1 ]; then
              echo "::error::重试 $MAX_RETRY 次后仍未能获取完整第二行"
              exit 1
            fi
          fi

          echo "::group::拆分 + 重组节点链接"
          echo "→ 拆分前总长: $(echo -n "$RAW_LINE" | wc -c)"

          case "$RAW_LINE" in
            *\#*)
              BODY="${RAW_LINE%#*}"
              NAME="${RAW_LINE##*#}"
              ;;
            *)
              BODY="$RAW_LINE"
              NAME=""
              ;;
          esac

          case "$BODY" in
            *\?*)
              AUTHORITY="${BODY%%\?*}"
              QS="${BODY#*\?}"
              ;;
            *)
              AUTHORITY="$BODY"
              QS=""
              ;;
          esac

          echo "→ AUTHORITY: $AUTHORITY"
          echo "→ QS 长度: $(echo -n "$QS" | wc -c)"
          echo "→ QS 前 80: ${QS:0:80}"
          echo "→ QS 后 50: ...${QS: -50}"
          echo "→ NAME: $NAME"

          NEW_AUTHORITY=$(printf '%s' "$AUTHORITY" | sed "s|${ORIGIN_TARGET}|${ROUTING_ADD}|g")
          echo "→ NEW_AUTHORITY: $NEW_AUTHORITY"

          NEW_URL="${NEW_AUTHORITY}?${QS}#${NAME}"
          FINAL_DATA="$NEW_URL"

          echo "→ 重组后总长: $(echo -n "$FINAL_DATA" | wc -c)"
          echo "  头部 120: ${FINAL_DATA:0:120}"
          echo "  尾部 50:  ...${FINAL_DATA: -50}"
          echo "::endgroup::"

          if [ -z "$FINAL_DATA" ]; then
            echo "::error::bash 重组链接失败"
            exit 1
          fi

          echo "::group::强校验环节"
          CHECK_OK=1
          CHECK_REASON=""

          [[ "$FINAL_DATA" == "$PROTO_PREFIX"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [协议前缀]"; }
          [[ "$FINAL_DATA" == *"$CHK_FLOW"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [flow]"; }
          [[ "$FINAL_DATA" == *"$CHK_TYPE"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [type]"; }
          [[ "$FINAL_DATA" == *"$CHK_HOST"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [host]"; }
          [[ "$FINAL_DATA" == *"$CHK_PATH"* ]] || { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [path]"; }

          [[ "$FINAL_DATA" == *"$ORIGIN_TARGET"* ]] && { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [原域名未替换]"; }
          [[ "$FINAL_DATA" != *"$ROUTING_ADD"* ]] && { CHECK_OK=0; CHECK_REASON="$CHECK_REASON [新域名未注入]"; }

          echo "→ 协议前缀: $([[ "$FINAL_DATA" == "$PROTO_PREFIX"* ]] && echo "✅" || echo "❌")"
          echo "→ flow:      $([[ "$FINAL_DATA" == *"$CHK_FLOW"* ]] && echo "✅" || echo "❌")"
          echo "→ type:      $([[ "$FINAL_DATA" == *"$CHK_TYPE"* ]] && echo "✅" || echo "❌")"
          echo "→ host:      $([[ "$FINAL_DATA" == *"$CHK_HOST"* ]] && echo "✅" || echo "❌")"
          echo "→ path:      $([[ "$FINAL_DATA" == *"$CHK_PATH"* ]] && echo "✅" || echo "❌")"
          echo "→ 原域名:    $([[ "$FINAL_DATA" == *"$ORIGIN_TARGET"* ]] && echo "❌ 未替换" || echo "✅ 已替换")"
          echo "→ 新域名:    $([[ "$FINAL_DATA" == *"$ROUTING_ADD"* ]] && echo "✅ 已注入" || echo "❌ 未注入")"

          if [ "$CHECK_OK" -ne 1 ]; then
            echo "::error::安全拒绝: 动态载荷参数不完整$CHECK_REASON"
            echo "重组后完整链接: $FINAL_DATA"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

          echo "::add-mask::$FINAL_DATA"
          echo "SYNC_PAYLOAD=$FINAL_DATA" >> $GITHUB_ENV
          echo "token-payload=$FINAL_DATA" >> $GITHUB_OUTPUT

          echo "✅ 所有校验全部通过,载荷长度 $(echo -n "$FINAL_DATA" | wc -c) 字节,准备同步"

      - name: Dispatch payload to remote endpoint
        env:
          SYNC_PAYLOAD: ${{ env.SYNC_PAYLOAD }}
          DEST_URL: ${{ env.DEST_URL }}
        run: |
          FULL_ENDPOINT="${DEST_URL}${SYNC_PAYLOAD}"

          echo "::add-mask::$FULL_ENDPOINT"

          echo "正在建立安全隧道并同步数据至远程部署中心..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$FULL_ENDPOINT")

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ 边缘网关数据同步成功"
          else
            echo "::error::同步阻断: 远程安全部署中心返回异常响应码: HTTP $RESPONSE"
            exit 1
          fi

      - name: Maintain runtime keep-alive
        run: |
          RUNTIME_HOURS="${{ env.RUNTIME_HOURS }}"
          RUNTIME_SECONDS=$((RUNTIME_HOURS * 3600))

          echo "已启动保持活跃循环,预计保持生命周期： $RUNTIME_HOURS 小时"
          START_TIME=$(date +%s)

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED_TIME -ge $RUNTIME_SECONDS ]; then
              echo "⏰ 已达到预设的运行生命周期,工作流即将关闭。"
              break
            fi

            if [ $((ELAPSED_TIME % 600)) -eq 0 ]; then
              echo "⏳ 状态检查：核心保活持久化服务运行中。"
            fi

            sleep 60
          done

      - name: Deconstruct and finalize
        run: |
          echo "✅ 常规自动化工作流成功结束"