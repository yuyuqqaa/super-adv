name: Run Argo

on:
  workflow_dispatch:  # 手动触发
    inputs:
      runtime:
        description: '运行时长（小时）'
        required: true
        default: '6'

env:
  VMPT_PORT: '8080'  # 固定端口
  ARGO_PROTOCOL: 'vmpt' 

jobs:
  run-argo:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6小时超时（360分钟）
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up environment variables
        env:
          UUID: ${{ secrets.UUID }}
          DURL: ${{ secrets.DURL }}
        run: |
          # 验证必需的secrets是否已设置
          if [ -z "$UUID" ]; then
            echo "::error::Secret UUID is not set"
            exit 1
          fi
          
          if [ -z "$DURL" ]; then
            echo "::error::Secret DURL is not set"
            exit 1
          fi
          
          # 设置环境变量（不显示在日志中）
          echo "UUID=$UUID" >> $GITHUB_ENV
          echo "DURL=$DURL" >> $GITHUB_ENV
          
          # 获取运行时长参数（默认6小时）
          RUNTIME_HOURS="${{ github.event.inputs.runtime || '6' }}"
          echo "RUNTIME_HOURS=$RUNTIME_HOURS" >> $GITHUB_ENV
          
          echo "::add-mask::$UUID"
          echo "::add-mask::$DURL"

      - name: Install dependencies
        run: |
          # 安装必要的依赖
          sudo apt-get update
          sudo apt-get install -y curl jq
          
          # 下载argosbx脚本
          curl -Ls https://raw.githubusercontent.com/yonggekkk/argosbx/main/argosbx.sh -o argosbx.sh
          chmod +x argosbx.sh

      - name: Run ArgoSBX script and capture vmess links
        id: run-argo
        run: |
          # 运行argosbx脚本并将输出重定向到文件（避免日志中显示）
          vmpt="${{ env.VMPT_PORT }}" uuid="${{ env.UUID }}" argo="${{ env.ARGO_PROTOCOL }}" ./argosbx.sh > argosbx_output.log 2>&1
          
          # 检查脚本是否成功运行
          if [ $? -ne 0 ]; then
            echo "::error::ArgoSBX script failed to run"
            cat argosbx_output.log
            exit 1
          fi
          
          # 提取所有vmess://链接
          echo "🔍 提取所有vmess://链接..."
          VMESS_LINKS=$(grep -oP 'vmess://[^\s"]+' argosbx_output.log)
          
          # 将链接转换为数组
          IFS=$'\n' read -d '' -ra VMESS_ARRAY <<< "$VMESS_LINKS"
          VMESS_COUNT=${#VMESS_ARRAY[@]}
          
          echo "✅ 找到 $VMESS_COUNT 个vmess链接"
          
          # 初始化变量
          PROXY_LINK=""
          MODIFIED_LINK=""
          
          # 处理第二个vmess链接（如果有）
          if [ $VMESS_COUNT -ge 2 ]; then
            echo "🎯 处理第二个vmess链接..."
            SECOND_LINK="${VMESS_ARRAY[1]}"
            
            # 解码Base64获取JSON
            BASE64_STR="${SECOND_LINK#vmess://}"
            JSON_STR=$(echo "$BASE64_STR" | base64 -d 2>/dev/null)
            
            if [ $? -eq 0 ]; then
              echo "✅ Base64解码成功"
              
              # 解析JSON并修改服务器地址
              MODIFIED_JSON=$(echo "$JSON_STR" | jq -r --arg new_add "cf.877774.xyz" '.add = $new_add')
              
              if [ $? -eq 0 ]; then
                echo "✅ JSON解析成功，服务器IP已修改"
                
                # 重新编码为Base64
                NEW_BASE64_STR=$(echo "$MODIFIED_JSON" | base64 -w 0 2>/dev/null)
                
                if [ $? -eq 0 ]; then
                  MODIFIED_LINK="vmess://$NEW_BASE64_STR"
                  echo "✅ 链接修改完成"
                else
                  echo "⚠️ Base64编码失败，使用原始链接"
                  MODIFIED_LINK="$SECOND_LINK"
                fi
              else
                echo "⚠️ JSON解析失败，使用原始链接"
                MODIFIED_LINK="$SECOND_LINK"
              fi
            else
              echo "⚠️ Base64解码失败，使用原始链接"
              MODIFIED_LINK="$SECOND_LINK"
            fi
            
            PROXY_LINK="$MODIFIED_LINK"
          elif [ $VMESS_COUNT -ge 1 ]; then
            echo "⚠️ 只找到一个vmess链接，使用该链接"
            PROXY_LINK="${VMESS_ARRAY[0]}"
          else
            echo "::error::未找到任何vmess链接"
            cat argosbx_output.log
            exit 1
          fi
          
          # 验证是否获取到代理链接
          if [ -z "$PROXY_LINK" ]; then
            echo "::error::Failed to extract proxy link from output"
            cat argosbx_output.log
            exit 1
          fi
          
          # 将代理链接保存到GITHUB_ENV（不会显示在日志中）
          echo "PROXY_LINK=$PROXY_LINK" >> $GITHUB_ENV
          
          # 设置输出参数（使用GitHub Actions的set-output）
          echo "::set-output name=proxy-link::$PROXY_LINK"
          
          # 清理输出文件（避免敏感信息残留）
          rm -f argosbx_output.log
          
          echo "✅ ArgoSBX script ran successfully and link was captured"

      - name: Send proxy link to DURL
        env:
          PROXY_LINK: ${{ env.PROXY_LINK }}
          DURL: ${{ env.DURL }}
        run: |
          # 构造完整的URL（拼接链接）
          FULL_URL="${DURL}${PROXY_LINK}"
          
          # 遮蔽完整URL，避免在日志中显示
          echo "::add-mask::$FULL_URL"
          
          # 发送GET请求到DURL
          echo "Sending to DURL..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$FULL_URL")
          
          # 检查请求是否成功
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "✅ link sent successfully to DURL (HTTP $RESPONSE)"
          else
            echo "::error::Failed to send proxy link to DURL (HTTP $RESPONSE)"
            exit 1
          fi

      - name: Keep workflow running for specified time
        run: |
          # 获取运行时长（小时）
          RUNTIME_HOURS="${{ env.RUNTIME_HOURS }}"
          RUNTIME_SECONDS=$((RUNTIME_HOURS * 3600))
          
          echo "Workflow will run for $RUNTIME_HOURS hours ($RUNTIME_SECONDS seconds)"
          
          # 显示开始时间
          START_TIME=$(date +%s)
          echo "Start time: $(date)"
          
          # 保持工作流运行直到超时
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED_TIME=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED_TIME -ge $RUNTIME_SECONDS ]; then
              echo "⏰ Runtime limit reached ($RUNTIME_HOURS hours). Workflow will end."
              break
            fi
            
            # 每10分钟打印一次状态（避免工作流被判定为无响应）
            if [ $((ELAPSED_TIME % 600)) -eq 0 ]; then
              echo "⏳ Still running... Elapsed: $((ELAPSED_TIME / 3600))h $((ELAPSED_TIME % 3600 / 60))m"
            fi
            
            sleep 60
          done

      - name: Workflow completed
        run: |
          echo "✅ Workflow completed successfully"
          echo "Proxy link was sent to DURL and workflow ran for ${{ env.RUNTIME_HOURS }} hours"
